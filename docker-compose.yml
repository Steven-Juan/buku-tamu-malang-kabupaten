services:
  app:
    build: .
    image: buku-tamu-malang:latest
    container_name: bukutamu-app
    restart: unless-stopped
    env_file: .env
    environment:
      # Override koneksi DB agar mengarah ke container MySQL
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:-bukutamu}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-bukutamu}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-bukutamu}
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      # File upload (foto tamu, tanda tangan, logo) tersimpan di folder host
      - ./storage/app/public:/var/www/html/storage/app/public
      - app-logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: bukutamu-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-bukutamu}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-bukutamu}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-bukutamu}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root}
      TZ: Asia/Jakarta
    ports:
      # 3307 di host agar tidak bentrok dengan MySQL lokal (XAMPP/Laragon)
      - "${DOCKER_DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DOCKER_DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
  app-logs:
